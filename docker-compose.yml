services:
   mongo:
      image: mongo:7
      ports:
         - "27017:27017"
      volumes:
         - mongo_data:/data/db
      restart: unless-stopped

   searxng:
      image: searxng/searxng:latest
      ports:
         - "8080:8080"
      volumes:
         - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      restart: unless-stopped

   qdrant:
      image: qdrant/qdrant:latest
      ports:
         - "6333:6333"
      volumes:
         - qdrant_data:/qdrant/storage
      restart: unless-stopped
      profiles:
         - dev
         - prod-ssr
         - prod-spa

   backend:
      build:
         context: ./backend
         dockerfile: Dockerfile
      environment:
         MONGO_URI: mongodb://mongo:27017
         DB_NAME: slave
         LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
         OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
         OLLAMA_TIMEOUT: 120
         OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
         OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
         VECTOR_STORE: ${VECTOR_STORE:-mongo}
         QDRANT_URL: http://qdrant:6333
         SEARXNG_URL: http://searxng:8080
         CORS_ORIGINS: '["http://localhost:4200","http://localhost:4000","http://localhost:4173","tauri://localhost","http://tauri.localhost"]'
         LOG_LEVEL: INFO
         API_KEY: ${API_KEY:-}
         SERPER_URL: https://google.serper.dev
         SERPER_API_KEY: ${SERPER_API_KEY:-}
         TAVILY_URL: https://api.tavily.com
         TAVILY_API_KEY: ${TAVILY_API_KEY:-}
         VOICE_ENABLED: ${VOICE_ENABLED:-true}
         WHISPER_MODEL: ${WHISPER_MODEL:-base}
         PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      ports:
         - "8000:8000"
      volumes:
         - voice_models:/app/voice_models
      depends_on:
         - mongo
         - searxng
      restart: unless-stopped
      profiles:
         - prod-ssr
         - prod-spa

   backend-dev:
      build:
         context: ./backend
         dockerfile: Dockerfile
      environment:
         MONGO_URI: mongodb://mongo:27017
         DB_NAME: slave
         LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
         OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
         OLLAMA_TIMEOUT: 120
         OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
         OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
         VECTOR_STORE: ${VECTOR_STORE:-mongo}
         QDRANT_URL: http://qdrant:6333
         SEARXNG_URL: http://searxng:8080
         CORS_ORIGINS: '["http://localhost:4200","tauri://localhost","http://tauri.localhost"]'
         LOG_LEVEL: DEBUG
         API_KEY: ${API_KEY:-}
         SERPER_URL: https://google.serper.dev
         SERPER_API_KEY: ${SERPER_API_KEY:-}
         TAVILY_URL: https://api.tavily.com
         TAVILY_API_KEY: ${TAVILY_API_KEY:-}
         VOICE_ENABLED: ${VOICE_ENABLED:-true}
         WHISPER_MODEL: ${WHISPER_MODEL:-base}
         PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      command: >-
         uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      ports:
         - "8000:8000"
      volumes:
         - ./backend:/app
         - voice_models:/app/voice_models
      depends_on:
         - mongo
         - searxng
      restart: unless-stopped
      profiles:
         - dev

   frontend-ssr:
      build:
         context: ./frontend
         dockerfile: Dockerfile
         target: ssr
      environment:
         PORT: 4000
         API_PROXY_TARGET: http://backend:8000
      ports:
         - "4000:4000"
      depends_on:
         - backend
      restart: unless-stopped
      profiles:
         - prod-ssr

   frontend-spa:
      build:
         context: ./frontend
         dockerfile: Dockerfile
         target: spa
      ports:
         - "4173:4173"
      depends_on:
         - backend
      restart: unless-stopped
      profiles:
         - prod-spa

   frontend-dev:
      build:
         context: ./frontend
         dockerfile: Dockerfile
         target: dev
      command: >-
         npm start -- --configuration docker --host 0.0.0.0
      ports:
         - "4200:4200"
      volumes:
         - ./frontend:/app
         - /app/node_modules
      depends_on:
         - backend-dev
      restart: unless-stopped
      profiles:
         - dev

   ollama:
      image: ollama/ollama:latest
      ports:
         - "11434:11434"
      volumes:
         - ollama_data:/root/.ollama
      restart: unless-stopped
      profiles:
         - ollama-cpu
      command: serve

   ollama-gpu:
      image: ollama/ollama:latest
      profiles:
         - ollama-gpu
      ports:
         - "11434:11434"
      volumes:
         - ollama_data:/root/.ollama
      deploy:
         resources:
            reservations:
               devices:
                  - driver: nvidia
                    count: all
                    capabilities: [gpu]
      command: serve
         

volumes:
   mongo_data:
   ollama_data:
   qdrant_data:
   voice_models: